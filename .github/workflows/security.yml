name: security

# Secret scanning and static analysis on every push and pull request.
# No secrets are used. No paid services. Actions are pinned to full commit SHAs
# (resolved with `git ls-remote` on 2026-11-23); tool versions are pinned.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24.11"
          cache: false

      # Installed through the Go module proxy, which verifies the module
      # checksum against sum.golang.org. Avoids gitleaks-action's licence key.
      - name: Install gitleaks v8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --exit-code 1 .

  semgrep:
    name: semgrep (default + secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install semgrep 1.184.0
        run: python -m pip install --disable-pip-version-check "semgrep==1.184.0"

      # Public registry rulesets; no Semgrep account or token; metrics off.
      - name: Scan
        run: >-
          semgrep scan
          --config p/default
          --config p/secrets
          --error
          --metrics=off
          --disable-version-check
