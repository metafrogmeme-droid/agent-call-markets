[package]
name = "call_markets"
version = "0.1.0"
description = "Agent Call Markets: sealed agent calls settled from Pyth. Solana devnet hackathon demo, test tokens only, unaudited."
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "call_markets"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Feature flags referenced by Anchor's generated code.
anchor-debug = []
custom-heap = []
custom-panic = []
no-log-ix-name = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = { version = "=1.2.2", default-features = false, features = ["token", "token_2022", "solana-v3"] }
pyth-solana-receiver-sdk = "=2.0.0"
solana-sha256-hasher = "=3.1.0"

[dev-dependencies]
bincode = "1"
proptest = "=1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "3"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-program-test = { version = "=3.1.12", features = ["agave-unstable-api"] }
solana-signer = "3"
solana-transaction = "3"
solana-transaction-error = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
